name: Release

# Push a tag such as v1.2.0 and GitHub builds OwnTV.apk and attaches it to a new release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build
        working-directory: launcher
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION=1.0.0 ;; esac
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk ../OwnTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OwnTV.apk
          path: OwnTV.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OwnTV.apk
          body_path: .github/release-notes.md
