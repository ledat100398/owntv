name: Release

# Every change to the app on main rebuilds OwnTV.apk and puts it on the release for the current
# version (the default versionName in launcher/app/build.gradle). Raise that number for a new release.
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/release.yml'
      - '.github/release-notes.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  apk:
    # 24.04 ships the Android SDK (ANDROID_HOME) with licences accepted.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        working-directory: launcher
        run: |
          set -o pipefail
          VERSION=$(sed -n "s/.*findProperty('versionName') ?: '\([0-9.]*\)'.*/\1/p" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          if ! ./gradlew --no-daemon --console=plain assembleRelease -PversionName="$VERSION" 2>&1 | tee build.log; then
            # Logs need a sign-in; annotations and the summary are public, so surface the error there.
            grep -E "error|What went wrong|FAILURE|Exception" build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            { echo '```'; tail -60 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../OwnTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OwnTV.apk
          path: OwnTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OwnTV ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: OwnTV.apk
          overwrite_files: true
          make_latest: 'true'
