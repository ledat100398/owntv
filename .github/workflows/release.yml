name: Release

# Every change to the app on main rebuilds OwnTV.apk and puts it on the release for the current
# version (the default versionName in launcher/app/build.gradle). Raise that number for a new release.
on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/release.yml'
      - '.github/release-notes.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build
        working-directory: launcher
        run: |
          VERSION=$(sed -n "s/.*findProperty('versionName') ?: '\([0-9.]*\)'.*/\1/p" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk ../OwnTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OwnTV.apk
          path: OwnTV.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OwnTV ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: OwnTV.apk
          overwrite_files: true
          make_latest: 'true'
