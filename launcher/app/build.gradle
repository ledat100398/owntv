plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.ledat100398.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.ledat100398.tvhome'
        minSdk 26
        targetSdk 34
        // The release workflow passes -PversionName=<tag>; the version code follows from it (1.2.3 -> 10203),
        // so a build made from the same source on your own computer is the same version as the release.
        def vn = (project.findProperty('versionName') ?: '1.1.0').toString()
        def p = vn.tokenize('.').collect { it.replaceAll('[^0-9]', '') ?: '0' }.collect { it as int }
        versionCode p[0] * 10000 + (p.size() > 1 ? p[1] : 0) * 100 + (p.size() > 2 ? p[2] : 0)
        versionName vn
    }

    signingConfigs {
        // One public key for release and local builds; see ../signing/README.md.
        owntv {
            storeFile rootProject.file('signing/owntv.jks')
            storePassword 'owntv-public'
            keyAlias 'owntv'
            keyPassword 'owntv-public'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.owntv
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.owntv
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
